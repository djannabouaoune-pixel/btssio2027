<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title> Inscription Nouveau client- Méditerranée </title>
</head>
<body bgcolor="CBFCBB">


<form action="#" method="post"></form>

<header>
	<h1> Incription d'un nouveau client</h1> 
</header>

	<table width=”70%” border="0">

<tr> <td> <label for="nom"> Nom: </label></td>
<td> <input type="text" id="nom" name="nom"></td> </tr>

<tr> <td> <label for="prenom"> Prénom: </label></td>
<td><input type="text" id="prenom" name="prenom"></td> </tr>


<tr> <td> <label for="date_naissance"> Date de naissance: </label></td>
<td><input type="date" id="date_naissance" name="date-naissance"></td> </tr>


<tr> <td> <label for="email"> Adresse mail: </label></td>
<td><input type="email" id="email" name="email"></td> </tr>


<tr> <td> <label for="mdp"> Mot de passe: </label></td>
<td><input type="passsword" id="mdp" name="mdp">


<tr> <td> <label for="permis"> Numéro de permis: </label></td>
<td><input type="text" id="permis" name="permis"></td> </tr>


<tr> <td> <label for="anciennete"> Nombre d'année d'ancienneté: </label></td>
<td><input type="number" id="anciennete" name="anciennete" min="0" max="80"></td> </tr>


<tr><td>
<label for="ville"> Ville: </label></td>
<td>
<select id="ville" name="ville">
	<option value="paris"> Paris</option>
	<option value="versailles"> Versailles </option>
	<option value="creteil"> Créteil </option>
</select></td></tr>

<tr> <td>
<label for="adresse"> Adresse du client: </label></td>
<td>
<textarea id="adresse" name="adresse" rows="4" cols="30"></textarea></td></tr>
</table>

<p> Situation patrimoine: </p>
<label for="marie_oui"> Marié </label>
<input type="radio" id="marie_oui" name="marie" value="oui">
<label for="marie_non"> Non marié </label>
<input type="radio" id="marie_non" name="marie" value="non">


<p> Préference voiture: </p>
<label for="pref_auto"> Automatiquem </label>
<input type="checkbox" id="pref_auto" name="preference_auto" value="automatique">
<label for="pref_manuelle"> Mabuelle </label>
<input type="checkbox" id="pref_manuelle" name="preference_manuelle" value="manuelle">



<button type="submit"> Enregistrer </button> 
<button type="reste"> Annuler </button> 

<body>

	<header>
		<h1> Inscription d'un nouveau client</h1>
	</header>
	<section>
		<form action="#" method="post">
			... (tous les champs du formulaire, identés d'un niveau supplémentaire)
		</form>
	</section>

</body>

 


</body>
</html>
