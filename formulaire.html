<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body bgcolor="C8D6B3">


	<form action="#" method="post"></form>

<header>
	<h1> Ajout d'un nouveau véhicule </h1> 
</header>

	<table width=”60%” border="0">

<tr><td>
<label for="marque"> Marque : </label></td>
<td>
<select id="marque" name="marque">
	<option value="peugeot"> Peugeot </option>
	<option value="mercedes"> Mercedes </option>
	<option value="renault"> Renault </option>
</select></td></tr>

<tr> <td> <label for="immatriculation"> Immatriculation: </label></td>
<td> <input type="text" id="immatriculation" name="immatriculation"></td> </tr>

<tr> <td> <label for="couleur"> Couleur : </label></td>
<td><input type="text" id="prenom" name="prenom"></td> </tr>


<tr> <td> <label for="date_immatriculation"> Date d'immatriculation : </label></td>
<td><input type="date" id="date_immatriculation" name="date-immatriculation"></td> </tr>


<tr> <td> <label for="email"> Kilométrage: </label></td>
<td><input type="text" id="kilometrage" name="kilometrage"></td> </tr>


<tr><td><label for="etat"> Etat : </label></td>
<td> <button type="submit"> Occasion </button></td>
<td><button type="reste"> Neuf </button></td> </tr> 


<tr> <td> <label for="carburant"> Carburant : </label></td>
<td> <button type="submit"> Hybride </button></td>
<td><button type="reste"> Electrique </button></td></tr> 
<tr> <td></td>
<td> <button type="submit"> Diesel </button></td>
<td><button type="reste"> Essence </button></td> </tr> 

<tr><td>
<label for="boite_vitesses"> Boîte de vitesses : </label></td>
<td>
<select id="boite_vitesses" name="boite_vitesses">
	<option value="manuelle"> Manuelle </option>
	<option value="automatique"> Automatique </option>
</select></td></tr>


<tr><td>
<label for="marque"> Nombre de portes : </label></td>
<td>
<select id="nombre_portes" name="nombre_portes">
	<option value="deux_portes"> Deux portes</option>
	<option value="trois_portes"> Trois portes </option>
	<option value="quatre_portes"> Quatre portes </option>
	<option value="cinq_portes"> Cinq portes </option>
</select></td></tr>


<tr><td> <label for="prix_location">Prix de location journalier (prix en €) :</label></td>
<td><input type="number" id="prix_location" name="prix_location" min="0" step="0.01"></td></td>


<tr><td><label for="caution"> Caution : </label></td>
<td><label for="caution_oui"> Oui </label></td>
<td><input type="radio" id="caution_oui" name="oui" value="oui"></td>
<td><label for="caution_non"> Non </label></td>
<td><input type="radio" id="caution_non" name="marie" value="non"></td></tr>


</table>


<button type="submit"> Enregistrer </button> 
<button type="reste"> Annuler </button> 


<footer> 
<p>&copy; 2026 Agence Méditerannée- Location de véhicule </p>
</footer>
</body>


</body>
</html>
